<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bob Change Impact Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: {} },
      plugins: []
    };
  </script>
  <style>
    /* Prose-like styles for markdown output since CDN Tailwind Typography is not always bundled */
    .prose h1  { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .prose h2  { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    .prose h3  { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .prose p   { margin-bottom: 0.75rem; line-height: 1.6; }
    .prose ul  { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    .prose ol  { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    .prose li  { margin-bottom: 0.25rem; }
    .prose pre { background: #f3f4f6; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin-bottom: 0.75rem; }
    .prose code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.875rem; }
    .prose pre code { background: transparent; padding: 0; }
    .prose table { border-collapse: collapse; width: 100%; margin-bottom: 0.75rem; }
    .prose th, .prose td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
    .prose th { background: #f9fafb; font-weight: 600; }
    .prose strong { font-weight: 700; }
    .prose em { font-style: italic; }
    .prose a { color: #3b82f6; text-decoration: underline; }
    .prose blockquote { border-left: 4px solid #e5e7eb; padding-left: 1rem; color: #6b7280; margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header id="header" class="bg-gray-900 text-white px-6 py-4 shadow-lg">
    <div class="max-w-3xl mx-auto flex items-center gap-3">
      <span class="text-2xl">🤖</span>
      <h1 class="text-xl font-bold tracking-tight">Bob Change Impact Mode</h1>
    </div>
  </header>

  <!-- Main content -->
  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Form section -->
    <section id="form-section" class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Describe your change</h2>
      <div class="space-y-4">
        <div>
          <label for="change-desc" class="block text-sm font-medium text-gray-700 mb-1">
            Change description
          </label>
          <input
            id="change-desc"
            type="text"
            placeholder="e.g. Add PayPal support to the checkout flow"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
        <div>
          <label for="repo-path" class="block text-sm font-medium text-gray-700 mb-1">
            Repository path
          </label>
          <input
            id="repo-path"
            type="text"
            placeholder="e.g. ./payment_demo"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
        <div class="flex justify-end">
          <button
            id="analyse-btn"
            class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-8 py-2 rounded-lg transition-colors"
          >
            Analyse
          </button>
        </div>
      </div>
    </section>

    <!-- Stages container -->
    <div id="stages-container" class="space-y-4"></div>

    <!-- Error panel -->
    <details id="error-panel" class="hidden mt-6 bg-red-50 border border-red-200 rounded-xl p-4">
      <summary class="cursor-pointer text-red-600 font-semibold select-none">
        ⚠ Errors
      </summary>
      <ul id="error-list" class="mt-3 space-y-1 text-sm text-red-700 list-disc pl-5"></ul>
    </details>

  </main>

  <script>
    /* ─────────────────────────────────────────────
       CONFIG
    ───────────────────────────────────────────── */
    const BASE_URL = 'http://localhost:8000';

    /* ─────────────────────────────────────────────
       STATE
    ───────────────────────────────────────────── */
    let state = { runId: null, eventSource: null };

    /* ─────────────────────────────────────────────
       DOM REFS
    ───────────────────────────────────────────── */
    const analyseBtn     = document.getElementById('analyse-btn');
    const changeDescEl   = document.getElementById('change-desc');
    const repoPathEl     = document.getElementById('repo-path');
    const stagesContainer = document.getElementById('stages-container');
    const errorPanel     = document.getElementById('error-panel');
    const errorList      = document.getElementById('error-list');

    /* ─────────────────────────────────────────────
       BADGE HELPERS
    ───────────────────────────────────────────── */
    function riskBadge(level) {
      const map = {
        HIGH:   'bg-red-100 text-red-800',
        MEDIUM: 'bg-orange-100 text-orange-800',
        LOW:    'bg-yellow-100 text-yellow-800'
      };
      const cls = map[(level || '').toUpperCase()] || 'bg-gray-100 text-gray-800';
      return `<span class="inline-block px-2 py-1 rounded text-xs font-bold ${cls}">${level}</span>`;
    }

    function testBadge(result) {
      const pass = (result || '').toLowerCase() === 'pass';
      const cls = pass ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
      return `<span class="inline-block px-2 py-1 rounded text-xs font-bold ${cls}">${(result || '').toUpperCase()}</span>`;
    }

    function statusBadge(label, colour) {
      const colourMap = {
        green:  'bg-green-100 text-green-800',
        orange: 'bg-orange-100 text-orange-800',
        red:    'bg-red-100 text-red-800',
        blue:   'bg-blue-100 text-blue-800',
        gray:   'bg-gray-100 text-gray-800'
      };
      const cls = colourMap[colour] || colourMap.gray;
      return `<span class="inline-block px-3 py-1 rounded-full text-sm font-bold ${cls}">${label}</span>`;
    }

    /* ─────────────────────────────────────────────
       CARD FACTORY
    ───────────────────────────────────────────── */
    function createCard(id, title, borderColour) {
      const card = document.createElement('div');
      card.id = id;
      card.className = `bg-white rounded-xl shadow-md border-l-4 ${borderColour} p-6 mb-4 transition-all`;
      card.innerHTML = `
        <h2 class="text-lg font-semibold text-gray-800 mb-3">${title}</h2>
        <div class="card-content"></div>
      `;
      return card;
    }

    function appendCard(id, title, borderColour) {
      // Remove existing card with same id if present (re-runs)
      const existing = document.getElementById(id);
      if (existing) existing.remove();
      const card = createCard(id, title, borderColour);
      stagesContainer.appendChild(card);
      return card.querySelector('.card-content');
    }

    /* ─────────────────────────────────────────────
       SPINNER HTML
    ───────────────────────────────────────────── */
    const SPINNER_HTML = `
      <div class="flex items-center gap-2 text-gray-500">
        <div class="animate-spin h-5 w-5 border-2 border-blue-500 border-t-transparent rounded-full"></div>
        <span>Running three agents in parallel…</span>
      </div>
    `;

    /* ─────────────────────────────────────────────
       STAGE 1 — Agents Running
    ───────────────────────────────────────────── */
    function showStage1Spinner() {
      const content = appendCard('stage-1', '⚙ Stage 1 — Agents Running', 'border-blue-500');
      content.innerHTML = SPINNER_HTML;
    }

    function populateStage1(payload) {
      const card = document.getElementById('stage-1');
      if (!card) return;
      const content = card.querySelector('.card-content');

      const affectedFiles = payload.affected_files || [];
      const dbImpact      = payload.database_impact || [];
      const testsToRun    = payload.tests_to_run    || [];

      let html = '';

      if (affectedFiles.length) {
        html += `<h3 class="font-semibold text-gray-700 mt-2 mb-1">Affected Files</h3>
          <ul class="list-disc pl-5 text-sm text-gray-600 space-y-0.5">
            ${affectedFiles.map(f => `<li>${escHtml(f)}</li>`).join('')}
          </ul>`;
      }

      if (dbImpact.length) {
        html += `<h3 class="font-semibold text-gray-700 mt-4 mb-1">Database Impact</h3>
          <table class="w-full text-sm border-collapse">
            <thead><tr class="bg-gray-50">
              <th class="border border-gray-200 px-3 py-2 text-left">Table</th>
              <th class="border border-gray-200 px-3 py-2 text-left">Risk</th>
            </tr></thead>
            <tbody>
              ${dbImpact.map(row => `
                <tr>
                  <td class="border border-gray-200 px-3 py-2">${escHtml(row.table || row.name || JSON.stringify(row))}</td>
                  <td class="border border-gray-200 px-3 py-2">${riskBadge((row.risk || row.risk_level || '').toUpperCase())}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }

      if (testsToRun.length) {
        html += `<h3 class="font-semibold text-gray-700 mt-4 mb-1">Tests to Run</h3>
          <ul class="list-disc pl-5 text-sm text-gray-600 space-y-0.5">
            ${testsToRun.map(t => `<li>${escHtml(t)}</li>`).join('')}
          </ul>`;
      }

      content.innerHTML = html || '<p class="text-sm text-gray-500">Agents completed.</p>';
    }

    /* ─────────────────────────────────────────────
       STAGE 2 — Impact Report
    ───────────────────────────────────────────── */
    function createStage2(payload) {
      const content = appendCard('stage-2', '📊 Stage 2 — Impact Report', 'border-purple-500');
      const riskLevel = (payload.risk_level || '').toUpperCase();
      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="text-sm font-medium text-gray-600">Risk:</span>
          ${riskBadge(riskLevel || 'UNKNOWN')}
        </div>
        <div class="prose prose-sm max-w-none text-gray-700">
          ${marked.parse(payload.impact_summary || '')}
        </div>
      `;
    }

    /* ─────────────────────────────────────────────
       STAGE 3 — Implementation Plan
    ───────────────────────────────────────────── */
    function createStage3(payload) {
      const content = appendCard('stage-3', '🗺 Stage 3 — Implementation Plan', 'border-indigo-500');
      content.innerHTML = `
        <div class="prose prose-sm max-w-none text-gray-700">
          ${marked.parse(payload.implementation_plan || '')}
        </div>
      `;
    }

    /* ─────────────────────────────────────────────
       STAGE 4 — Human Approval
    ───────────────────────────────────────────── */
    function createStage4(runId) {
      const content = appendCard('stage-4', '✋ Stage 4 — Human Approval', 'border-yellow-500');
      content.innerHTML = `
        <p class="text-sm text-gray-600 mb-4">Review the impact report and implementation plan above, then approve or reject this change.</p>
        <div id="approval-buttons" class="flex gap-4">
          <button id="approve-btn"
            class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">
            ✅ Approve
          </button>
          <button id="reject-btn"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">
            ❌ Reject
          </button>
        </div>
        <div id="approval-decision" class="hidden text-base font-semibold mt-2"></div>
      `;

      document.getElementById('approve-btn').addEventListener('click', () => sendApproval(runId, true));
      document.getElementById('reject-btn').addEventListener('click',  () => sendApproval(runId, false));
    }

    async function sendApproval(runId, approved) {
      const buttons   = document.getElementById('approval-buttons');
      const decisionEl = document.getElementById('approval-decision');
      if (!buttons) return;

      buttons.classList.add('hidden');
      decisionEl.classList.remove('hidden');
      decisionEl.textContent = approved ? 'Decision: Approved ✅' : 'Decision: Rejected ❌';
      decisionEl.className = `text-base font-semibold mt-2 ${approved ? 'text-green-700' : 'text-red-700'}`;

      try {
        await fetch(`${BASE_URL}/approve/${runId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approved })
        });
      } catch (err) {
        appendError(`Failed to send approval: ${err.message}`);
      }
    }

    /* ─────────────────────────────────────────────
       STAGE 5 — Bob Execution
    ───────────────────────────────────────────── */
    function createStage5(payload) {
      const content = appendCard('stage-5', '🚀 Stage 5 — Bob Execution', 'border-green-500');
      const codeModified = payload.code_modified;
      const affectedFiles = payload.affected_files || [];

      const modBadge = codeModified
        ? statusBadge('Code Modified', 'green')
        : statusBadge('No Changes', 'gray');

      let filesHtml = '';
      if (affectedFiles.length) {
        filesHtml = `
          <ul class="mt-3 space-y-1 text-sm text-gray-600">
            ${affectedFiles.map(f => `
              <li class="flex items-center gap-2">
                <span class="text-gray-400">→</span>
                <code class="bg-gray-100 px-1 rounded">${escHtml(f)}</code>
                <span class="text-xs text-gray-500">Modified</span>
              </li>`).join('')}
          </ul>`;
      }

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-2">${modBadge}</div>
        ${filesHtml}
      `;
    }

    /* ─────────────────────────────────────────────
       STAGE 6 — Test Results
    ───────────────────────────────────────────── */
    function createStage6(payload) {
      const content = appendCard('stage-6', '🧪 Stage 6 — Test Results', 'border-teal-500');
      const testResults = payload.test_results || payload || {};
      const perTest = testResults.per_test || testResults.tests || [];

      let passed = 0, failed = 0;
      perTest.forEach(t => {
        const r = (t.result || t.status || '').toLowerCase();
        if (r === 'pass' || r === 'passed') passed++;
        else failed++;
      });
      const total = perTest.length;

      let tableHtml = '';
      if (perTest.length) {
        tableHtml = `
          <table class="w-full text-sm border-collapse mt-2">
            <thead><tr class="bg-gray-50">
              <th class="border border-gray-200 px-3 py-2 text-left">Test</th>
              <th class="border border-gray-200 px-3 py-2 text-left">Result</th>
            </tr></thead>
            <tbody>
              ${perTest.map(t => `
                <tr>
                  <td class="border border-gray-200 px-3 py-2">${escHtml(t.name || t.test || '')}</td>
                  <td class="border border-gray-200 px-3 py-2">${testBadge(t.result || t.status || 'fail')}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }

      content.innerHTML = `
        <p class="text-sm font-medium text-gray-700">
          <span class="text-green-700 font-bold">${passed} passed</span> /
          <span class="text-red-700 font-bold">${failed} failed</span> /
          <span class="text-gray-600">${total} total</span>
        </p>
        ${tableHtml}
      `;
    }

    /* ─────────────────────────────────────────────
       STAGE 7 — Final Report
    ───────────────────────────────────────────── */
    function createStage7(payload) {
      const content = appendCard('stage-7', '📝 Stage 7 — Final Report', 'border-gray-500');
      const errors        = payload.errors || [];
      const humanApproved = payload.human_approved;

      let finalStatus;
      if (errors.length > 0) {
        finalStatus = statusBadge('FAILED', 'red');
      } else if (humanApproved === false) {
        finalStatus = statusBadge('REJECTED', 'orange');
      } else {
        finalStatus = statusBadge('COMPLETED', 'green');
      }

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-4">${finalStatus}</div>
        <div class="prose prose-sm max-w-none text-gray-700">
          ${marked.parse(payload.final_report || '')}
        </div>
      `;

      // Surface any errors from the final payload
      if (errors.length) {
        errors.forEach(e => appendError(typeof e === 'string' ? e : JSON.stringify(e)));
      }
    }

    /* ─────────────────────────────────────────────
       ERROR PANEL
    ───────────────────────────────────────────── */
    function appendError(message) {
      errorPanel.classList.remove('hidden');
      const li = document.createElement('li');
      li.textContent = message;
      errorList.appendChild(li);
    }

    /* ─────────────────────────────────────────────
       SSE STREAM
    ───────────────────────────────────────────── */
    function openStream(runId) {
      if (state.eventSource) {
        state.eventSource.close();
      }

      const es = new EventSource(`${BASE_URL}/stream/${runId}`);
      state.eventSource = es;

      es.onmessage = (evt) => {
        let parsed;
        try {
          parsed = JSON.parse(evt.data);
        } catch (e) {
          return;
        }
        const { event, payload } = parsed;
        dispatch(event, payload, runId);
      };

      es.onerror = (err) => {
        // Only report if we haven't already cleanly closed
        if (es.readyState === EventSource.CLOSED) return;
        appendError('SSE connection error. The server may have closed the stream.');
        closeStream();
        analyseBtn.disabled = false;
        analyseBtn.textContent = 'Analyse';
      };
    }

    function closeStream() {
      if (state.eventSource) {
        state.eventSource.close();
        state.eventSource = null;
      }
    }

    /* ─────────────────────────────────────────────
       EVENT DISPATCHER
    ───────────────────────────────────────────── */
    function dispatch(event, payload, runId) {
      switch (event) {
        case 'pipeline_started':
          // Stage 1 spinner is already shown; nothing extra needed
          break;
        case 'parallel_agents_done':
          populateStage1(payload);
          break;
        case 'impact_report_done':
          createStage2(payload);
          break;
        case 'implementation_plan_done':
          createStage3(payload);
          break;
        case 'awaiting_approval':
          createStage4(runId);
          break;
        case 'bob_execution_done':
          createStage5(payload);
          break;
        case 'test_results_done':
          createStage6(payload);
          break;
        case 'final_report_done':
          createStage7(payload);
          closeStream();
          analyseBtn.disabled = false;
          analyseBtn.textContent = 'Analyse';
          break;
        case 'error':
          appendError((payload && payload.message) ? payload.message : JSON.stringify(payload));
          break;
        default:
          break;
      }
    }

    /* ─────────────────────────────────────────────
       MAIN: runPipeline
    ───────────────────────────────────────────── */
    async function runPipeline() {
      const changeDesc = changeDescEl.value.trim();
      const repoPath   = repoPathEl.value.trim();

      if (!changeDesc) {
        changeDescEl.focus();
        changeDescEl.classList.add('border-red-400');
        return;
      }
      changeDescEl.classList.remove('border-red-400');

      // Reset UI
      analyseBtn.disabled = true;
      analyseBtn.textContent = 'Running…';
      stagesContainer.innerHTML = '';
      errorPanel.classList.add('hidden');
      errorList.innerHTML = '';
      closeStream();

      // Show Stage 1 spinner immediately
      showStage1Spinner();

      let runId;
      try {
        const resp = await fetch(`${BASE_URL}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            change_description: changeDesc,
            repo_path: repoPath || '.'
          })
        });

        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(`Server error ${resp.status}: ${errText}`);
        }

        const data = await resp.json();
        runId = data.run_id;
      } catch (err) {
        appendError(`Failed to start pipeline: ${err.message}`);
        analyseBtn.disabled = false;
        analyseBtn.textContent = 'Analyse';
        return;
      }

      state.runId = runId;
      openStream(runId);
    }

    /* ─────────────────────────────────────────────
       UTILITY
    ───────────────────────────────────────────── */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ─────────────────────────────────────────────
       EVENT LISTENERS
    ───────────────────────────────────────────── */
    analyseBtn.addEventListener('click', runPipeline);

    // Allow Enter key in inputs to trigger analysis
    changeDescEl.addEventListener('keydown', e => { if (e.key === 'Enter') runPipeline(); });
    repoPathEl.addEventListener('keydown',   e => { if (e.key === 'Enter') runPipeline(); });
  </script>
</body>
</html>
